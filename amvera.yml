# Конфигурация деплоя на Amvera Cloud (https://docs.amvera.ru)
# «Анализатор ПУ · ТП»: статическая страница (index.html) + локальная библиотека
# Excel. Весь анализ — в браузере, файлы выгрузок на сервер НЕ загружаются.
meta:
  environment: python
  toolchain:
    name: pip
    version: "3.12"
build:
  requirementsPath: requirements.txt
run:
  command: uvicorn main:app --host 0.0.0.0 --port 80
  containerPort: 80
  persistenceMount: /data
